services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: review
      POSTGRES_PASSWORD: review
      POSTGRES_DB: review
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review -d review"]
      interval: 2s
      timeout: 5s
      retries: 15
